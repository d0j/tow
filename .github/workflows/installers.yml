name: installers

# What release.yml tests on a tag, before the tag: the Windows bundle with its start files and
# install.ps1, and the update of the latest published release to this commit (the real updater,
# a broken copy that must roll back, then the update itself) on Windows and Linux. It runs on
# pull requests that touch the installers, the updater or what the bundle is built from, once a
# week (a new runner image or a new release of uv or Python), and by hand. Not a required check:
# the path filter would leave it pending on other pull requests. install.sh itself is tested on
# every commit by ci.yml. Weekly and by hand it also measures the work of all 45 large file
# selection scenarios (the gate measures the costliest of each kind).

on:
  pull_request:
    paths:
      - "scripts/**"
      - "install/**"
      - "src/tow/update*"
      - "src/tow/web_update.py"
      # What the updater relies on in the code it installs and starts: the state format it reads
      # (store.py), the interrupted-update rule (layout.py), `tow update` and `tow run` (cli.py),
      # its texts (locales).
      - "src/tow/store.py"
      - "src/tow/supervisor/layout.py"
      - "src/tow/cli.py"
      - "src/tow/locales/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/installers.yml"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      previous:
        description: "Release to update from (empty: the latest)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows bundle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Pinned to full commit SHAs (the tag in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Source archive of this commit
        shell: bash
        run: git archive --format=tar.gz --prefix=tow/ -o tow-source.tar.gz HEAD
      - name: Build the bundle
        shell: pwsh
        run: uv run --no-project python scripts/build-bundle.py --out dist --source tow-source.tar.gz
      - name: Unpack, start offline, stop, move with its existing environment, start offline again
        shell: pwsh
        run: ./scripts/bundle-smoke.ps1 -Zip dist/TOW-windows-x64.zip -Offline -Move
      - name: install.ps1 on Windows PowerShell 5.1, uninstall, reinstall around the data, purge
        shell: pwsh
        run: ./scripts/install-smoke.ps1 -Zip dist/TOW-windows-x64.zip -Port 18878

  selection:
    name: selection work (all scenarios)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install Python from .python-version
        run: uv python install --no-bin --no-registry
      - name: Every scenario of tests/selection_work_probe.py within its counted work bound
        env:
          TOW_SELECTION_WORK: all
        run: uv run --frozen pytest -q -p no:cacheprovider tests/test_selection_work_bounds.py

  update:
    name: update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Source archive of this commit
        shell: bash
        run: git archive --format=tar.gz --prefix=tow/ -o tow-source.tar.gz HEAD
      - name: The previous release's files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS: ${{ github.event.inputs.previous }}
        run: |
          tag=()
          if [ -n "$PREVIOUS" ]; then
            printf '%s\n' "$PREVIOUS" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?' || { echo "not a release tag: $PREVIOUS" >&2; exit 1; }
            tag=("$PREVIOUS")
          fi
          gh release view "${tag[@]}" --json tagName --jq '"previous release: " + .tagName'
          if [ "$RUNNER_OS" = Windows ]; then set -- TOW-windows-x64.zip; else set -- install.sh tow-source.tar.gz; fi
          for name in SHA256SUMS "$@"; do
            gh release download "${tag[@]}" --dir "$RUNNER_TEMP/previous" --pattern "$name"
          done
      - name: Update it to this commit (a broken copy rolls back), with the old and the new updater
        shell: bash
        run: uv run --no-project python scripts/update-smoke.py --previous "$RUNNER_TEMP/previous" --source tow-source.tar.gz
