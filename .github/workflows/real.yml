name: real systems

# What the gate replaces with fakes, for real: qBittorrent, Transmission and Deluge, each started
# on the runner with a login of this run and driven through TOW's own adapters and a real
# `tow check --apply` against a local site (tests/integration/test_real_clients.py); and the
# autostart of each OS - Task Scheduler, launchd, systemd --user - turned on for a throwaway
# install made the way the owner makes one, started by the OS and turned off again
# (tests/integration/test_real_autostart.py, in autostart.yml, which release.yml runs for a tag
# too). Those tests are skipped without TOW_REAL_CLIENTS / TOW_REAL_AUTOSTART, which only these
# workflows set: never on a development machine. It runs on
# pull requests that touch that code and when such a change reaches main, once a week (new runner
# images, new client versions) and by hand. Not a required check: the path filter would leave it
# pending on other pull requests. GitHub compares only the first 300 changed files with the
# filter: a larger change may skip it, and the weekly run still covers it.

on:
  pull_request:
    paths: &real_paths
      - "src/tow/clients/**"
      # The scan that finds the client modules (tow.clients.spec discovers them through it).
      - "src/tow/plugins.py"
      - "src/tow/autostart/**"
      - "src/tow/check/**"
      - "src/tow/supervisor/**"
      # What the client test runs through (torrents, folders, settings, state, `tow check`) and the
      # install the autostart test makes (installers, bundle, launchers, the OS layer).
      - "src/tow/torrent.py"
      - "src/tow/folders.py"
      - "src/tow/config.py"
      - "src/tow/store.py"
      - "src/tow/storage/**"
      - "src/tow/platform/**"
      - "src/tow/cli/**"
      - "install/**"
      - "scripts/build-bundle.py"
      - "scripts/tow*"
      # The tests' own helpers and guard (its real_system rule), and the locked dependencies (a
      # qbittorrent-api bump).
      - "tests/integration/**"
      - "tests/helpers.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/real.yml"
      - ".github/workflows/autostart.yml"
  push:
    branches: [main]
    paths: *real_paths
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clients:
    name: torrent clients
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOW_REAL_CLIENTS: "1"
      TOW_REAL_QBITTORRENT: 127.0.0.1:18080
      TOW_REAL_TRANSMISSION: 127.0.0.1:19091
      TOW_REAL_DELUGE: 127.0.0.1:18112
      TOW_REAL_CLIENT_USER: tow
    steps:
      # Pinned to full commit SHAs (the tag in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          save-cache: false
      - name: Install Python from .python-version
        run: uv python install --no-bin --no-registry
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Install qBittorrent, Transmission and Deluge (their system services stay off)
        timeout-minutes: 10
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod 755 /usr/sbin/policy-rc.d
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            qbittorrent-nox transmission-daemon deluged deluge-web
          sudo systemctl stop transmission-daemon deluged deluge-web 2>/dev/null || true
          dpkg-query -W qbittorrent-nox transmission-daemon deluged deluge-web
      - name: A login for this run, and the clients' folders
        run: |
          secret=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          echo "::add-mask::$secret"
          echo "TOW_REAL_CLIENT_SECRET=$secret" >> "$GITHUB_ENV"
          echo "CLIENTS=$RUNNER_TEMP/clients" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/clients/logs" "$RUNNER_TEMP/clients/downloads" \
            "$RUNNER_TEMP/clients/qbittorrent/qBittorrent/config" "$RUNNER_TEMP/clients/transmission" \
            "$RUNNER_TEMP/clients/deluge"
      - name: Start the clients on their own ports with that login
        run: |
          # qBittorrent: the Web UI login in its config file, PBKDF2-SHA512 as qBittorrent keeps it.
          key=$(python3 - <<'PY'
          import base64, hashlib, os
          salt = os.urandom(16)
          derived = hashlib.pbkdf2_hmac("sha512", os.environ["TOW_REAL_CLIENT_SECRET"].encode(), salt, 100000, 64)
          print(base64.b64encode(salt).decode() + ":" + base64.b64encode(derived).decode())
          PY
          )
          cat > "$CLIENTS/qbittorrent/qBittorrent/config/qBittorrent.conf" <<EOF
          [LegalNotice]
          Accepted=true

          [BitTorrent]
          Session\DHTEnabled=false
          Session\LSDEnabled=false
          Session\PeXEnabled=false
          Session\DefaultSavePath=$CLIENTS/downloads

          [Preferences]
          WebUI\Address=127.0.0.1
          WebUI\Port=18080
          WebUI\Username=$TOW_REAL_CLIENT_USER
          WebUI\Password_PBKDF2="@ByteArray($key)"
          EOF
          printf 'y\n' | nohup qbittorrent-nox --profile="$CLIENTS/qbittorrent" --webui-port=18080 \
            >"$CLIENTS/logs/qbittorrent.log" 2>&1 &
          echo $! >"$CLIENTS/qbittorrent.pid"

          nohup transmission-daemon --foreground --config-dir "$CLIENTS/transmission" --port 19091 \
            --auth --username "$TOW_REAL_CLIENT_USER" --password "$TOW_REAL_CLIENT_SECRET" --allowed 127.0.0.1 \
            --download-dir "$CLIENTS/downloads" --no-portmap --no-dht --logfile "$CLIENTS/logs/transmission.log" \
            >"$CLIENTS/logs/transmission-console.log" 2>&1 &
          echo $! >"$CLIENTS/transmission.pid"

          # Deluge Web keeps sha1(salt + password); its default host is the daemon of the same
          # config folder on 58846 (deluged's own "localclient" login from that folder's auth file).
          python3 - <<'PY'
          import hashlib, json, os, secrets
          salt = secrets.token_hex(20)
          digest = hashlib.sha1((salt + os.environ["TOW_REAL_CLIENT_SECRET"]).encode()).hexdigest()
          settings = {"pwd_salt": salt, "pwd_sha1": digest, "port": 18112, "interface": "127.0.0.1", "first_login": False}
          with open(os.path.join(os.environ["CLIENTS"], "deluge", "web.conf"), "w", encoding="utf-8") as handle:
              handle.write(json.dumps({"file": 2, "format": 1}, indent=4) + json.dumps(settings, indent=4))
          PY
          nohup deluged --do-not-daemonize --config "$CLIENTS/deluge" --port 58846 --loglevel info \
            --logfile "$CLIENTS/logs/deluged.log" >"$CLIENTS/logs/deluged-console.log" 2>&1 &
          echo $! >"$CLIENTS/deluged.pid"
          for attempt in $(seq 1 30); do [ -s "$CLIENTS/deluge/auth" ] && break; sleep 1; done
          [ -s "$CLIENTS/deluge/auth" ] || { echo "::error::deluged wrote no auth file in 30 s"; exit 1; }
          nohup deluge-web --do-not-daemonize --config "$CLIENTS/deluge" --port 18112 --interface 127.0.0.1 \
            --loglevel info --logfile "$CLIENTS/logs/deluge-web.log" >"$CLIENTS/logs/deluge-web-console.log" 2>&1 &
          echo $! >"$CLIENTS/deluge-web.pid"
      - name: Wait until each client answers with that login
        timeout-minutes: 5
        run: |
          wait_for() {
            name=$1
            shift
            for attempt in $(seq 1 60); do
              if "$@"; then echo "$name answers"; return 0; fi
              sleep 2
            done
            echo "::error::$name does not answer within 120 s"
            return 1
          }
          qbt_up() { [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18080/api/v2/app/version)" != 000 ]; }
          qbt_login() {
            curl -fsS --max-time 5 --data-urlencode "username=$TOW_REAL_CLIENT_USER" \
              --data-urlencode "password=$TOW_REAL_CLIENT_SECRET" http://127.0.0.1:18080/api/v2/auth/login | grep -qx 'Ok.'
          }
          transmission_up() {
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -u "$TOW_REAL_CLIENT_USER:$TOW_REAL_CLIENT_SECRET" \
              http://127.0.0.1:19091/transmission/rpc)" = 409 ]
          }
          deluged_up() { (echo >/dev/tcp/127.0.0.1/58846) 2>/dev/null; }
          deluge_web_login() {
            curl -fsS --max-time 5 -H 'Content-Type: application/json' \
              --data "{\"method\": \"auth.login\", \"params\": [\"$TOW_REAL_CLIENT_SECRET\"], \"id\": 1}" \
              http://127.0.0.1:18112/json | grep -q '"result": *true'
          }
          wait_for qBittorrent qbt_up
          if ! qbt_login; then
            # A qBittorrent that ignored the configured login prints a temporary one (4.6.1+):
            # sign in with it and set this run's login through the Web API.
            temporary=$(sed -n 's/.*temporary password is provided for this session: *//p' "$CLIENTS/logs/qbittorrent.log" | tail -n 1 | tr -d '\r ')
            [ -n "$temporary" ] || { echo "::error::qBittorrent refused the configured login and printed no temporary one"; exit 1; }
            echo "::add-mask::$temporary"
            echo "qBittorrent ignored the configured login: setting it through the Web API"
            curl -fsS -c "$CLIENTS/qbt.cookies" --data-urlencode "username=admin" --data-urlencode "password=$temporary" \
              http://127.0.0.1:18080/api/v2/auth/login
            python3 -c 'import json, os; print(json.dumps({"web_ui_username": os.environ["TOW_REAL_CLIENT_USER"], "web_ui_password": os.environ["TOW_REAL_CLIENT_SECRET"]}))' >"$CLIENTS/qbt-login.json"
            curl -fsS -b "$CLIENTS/qbt.cookies" --data-urlencode "json@$CLIENTS/qbt-login.json" \
              http://127.0.0.1:18080/api/v2/app/setPreferences
            rm -f "$CLIENTS/qbt-login.json" "$CLIENTS/qbt.cookies"
            wait_for "qBittorrent with this run's login" qbt_login
          fi
          wait_for Transmission transmission_up
          wait_for deluged deluged_up
          wait_for "Deluge Web" deluge_web_login
      - name: TOW's adapters and `tow check --apply` against the real clients
        timeout-minutes: 20
        run: uv run --frozen pytest -q -ra -p no:cacheprovider tests/integration/test_real_clients.py
      - name: The clients' logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-logs
          path: |
            ${{ env.CLIENTS }}/logs
            ${{ env.CLIENTS }}/qbittorrent/qBittorrent/data/logs
          if-no-files-found: warn
      - name: Stop the clients
        if: always()
        run: |
          for name in qbittorrent transmission deluge-web deluged; do
            [ ! -f "$CLIENTS/$name.pid" ] || kill "$(cat "$CLIENTS/$name.pid")" 2>/dev/null || true
          done

  # The OS autostart of the three systems (autostart.yml, which release.yml runs for a tag too);
  # the weekly run does not pass on a runner that cannot run it.
  autostart:
    uses: ./.github/workflows/autostart.yml
    with:
      ref: ${{ github.sha }}
      strict: ${{ github.event_name == 'schedule' }}
