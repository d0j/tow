name: release

# A release tag (vX.Y.Z) builds and tests what the README links to, then uploads it to the
# GitHub release of that tag (created from CHANGELOG.md when it does not exist yet; existing
# notes are never changed). The release stays a draft until every file below is uploaded and
# read back; the files of a public release are never replaced:
#   TOW-windows-x64.zip   the Windows bundle (scripts/build-bundle.py)
#   install.ps1           irm .../releases/latest/download/install.ps1 | iex
#   install.sh            curl -LsSf .../releases/latest/download/install.sh | sh
#   tow-source.tar.gz     GitHub's source archive of the tag (what install.sh and updates use)
#   SHA256SUMS            the SHA-256 of every file above
# The quality gate is not run again: the tag must be an annotated "TOW X.Y.Z" on origin/main
# whose commit passed the `ci` workflow (its four-OS gate). Nothing is uploaded unless the
# bundle, both installers and the update of the latest published release to this tag
# (scripts/update-smoke.py) passed on the runners.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, test and upload (e.g. v1.22.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  source:
    name: source archive
    runs-on: ubuntu-24.04
    # Waits for the ci run of the tagged commit when the tag follows its merge right away.
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is an annotated "TOW X.Y.Z" on origin/main
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?' || { echo "not a release tag: $TAG" >&2; exit 1; }
          # The tag object itself (a checkout of a tag may leave only its commit).
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] || { echo "$TAG is not an annotated tag" >&2; exit 1; }
          message=$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")
          [ "$message" = "TOW ${TAG#v}" ] || { echo "the message of $TAG is '$message', not 'TOW ${TAG#v}'" >&2; exit 1; }
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main || { echo "$TAG ($commit) is not on origin/main" >&2; exit 1; }
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
      - name: The ci workflow passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A finished successful run is enough; one still running is waited for (a tag pushed
          # right after the merge); none, or only failed ones, stop the release.
          for attempt in $(seq 1 90); do
            verdict=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$COMMIT&per_page=100" --jq '
              [.workflow_runs[] | "\(.status)/\(.conclusion)"]
              | if any(. == "completed/success") then "passed"
                elif length == 0 then "none"
                elif all(startswith("completed/")) then "failed"
                else "running" end')
            echo "ci on $COMMIT: $verdict"
            case $verdict in
              passed) exit 0 ;;
              failed) echo "ci did not pass on $COMMIT (a cancelled run: re-run it, then this)" >&2; exit 1 ;;
              none) [ "$attempt" -le 6 ] || { echo "no ci run for $COMMIT: run ci on main before releasing" >&2; exit 1; } ;;
            esac
            sleep 30
          done
          echo "ci did not finish on $COMMIT in time" >&2
          exit 1
      - name: Download GitHub's source archive of the tag
        run: |
          curl -fsSL --retry 3 -o tow-source.tar.gz "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          top=$(tar -tzf tow-source.tar.gz | head -n 1 | cut -d / -f 1)
          version=$(tar -xzOf tow-source.tar.gz "$top/pyproject.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1)
          echo "top folder $top, version $version"
          [ "v$version" = "$TAG" ] || { echo "the tag $TAG holds version $version" >&2; exit 1; }
          sha256sum tow-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: tow-source.tar.gz
          if-no-files-found: error

  windows:
    name: Windows bundle
    needs: [source]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Pinned to full commit SHAs (the tag in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source
      - name: Build the bundle
        shell: pwsh
        run: uv run --no-project python scripts/build-bundle.py --out dist --source tow-source.tar.gz
      - name: Unpack, start offline, stop, move with its existing environment, start offline again
        shell: pwsh
        run: ./scripts/bundle-smoke.ps1 -Zip dist/TOW-windows-x64.zip -Offline -Move
      - name: install.ps1 on Windows PowerShell 5.1, uninstall, reinstall around the data, purge
        shell: pwsh
        run: ./scripts/install-smoke.ps1 -Zip dist/TOW-windows-x64.zip -Port 18878
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/TOW-windows-x64.zip
          if-no-files-found: error

  posix:
    name: install.sh (${{ matrix.os }})
    needs: [source]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04, macos-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source
      - name: Install, start with the start file, check, stop, uninstall
        run: sh scripts/install-smoke.sh "$PWD/tow-source.tar.gz" 18877

  # The same job as in installers.yml: the latest published release is updated to this tag's
  # source archive by the real updater, once to a broken copy that must roll back.
  update:
    name: update (${{ matrix.os }})
    needs: [source]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source
      - name: The previous release's files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view --json tagName --jq '"previous release: " + .tagName'
          if [ "$RUNNER_OS" = Windows ]; then set -- TOW-windows-x64.zip; else set -- install.sh tow-source.tar.gz; fi
          for name in SHA256SUMS "$@"; do
            gh release download --dir "$RUNNER_TEMP/previous" --pattern "$name"
          done
      - name: Update it to this tag (a broken copy rolls back), with the old and the new updater
        shell: bash
        run: uv run --no-project python scripts/update-smoke.py --previous "$RUNNER_TEMP/previous" --source tow-source.tar.gz

  publish:
    name: upload to the release
    needs: [source, windows, posix, update]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Assets and SHA256SUMS
        run: |
          mkdir assets
          cp artifacts/TOW-windows-x64.zip artifacts/tow-source.tar.gz install/install.ps1 install/install.sh assets/
          cd assets
          sha256sum TOW-windows-x64.zip install.ps1 install.sh tow-source.tar.gz > SHA256SUMS
          cat SHA256SUMS
          ls -l
      - name: Draft the release, upload and read back every asset, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${TAG#v}
          expected="SHA256SUMS TOW-windows-x64.zip install.ps1 install.sh tow-source.tar.gz"
          names() { gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | join(" ")'; }
          readback() {
            rm -rf readback
            gh release download "$TAG" --dir readback
            (cd readback && sha256sum -c SHA256SUMS)
          }
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "the release of $TAG exists (draft: $draft)"
          else
            # Notes: what to download (EN, RU), then the tag's section of both changelogs.
            python3 scripts/release-notes.py "$TAG" "$GITHUB_REPOSITORY" > notes.md
            prerelease=
            case $TAG in *-*) prerelease=--prerelease ;; esac
            gh release create "$TAG" --draft --verify-tag --title "TOW $version" --notes-file notes.md $prerelease
            draft=true
          fi
          if [ "$draft" != true ]; then
            # Public already: its files are never replaced (a re-run would change their hashes).
            if [ "$(names)" = "$expected" ]; then
              readback
              echo "the release of $TAG is public and complete; nothing was changed"
              exit 0
            fi
            [ -z "$(names)" ] || { echo "the public release of $TAG has only: $(names)" >&2; exit 1; }
            gh release edit "$TAG" --draft=true  # public without files: a draft until they are all there
          fi
          # A label says what each file is for (shown instead of the file name; links keep the name).
          gh release upload "$TAG" --clobber \
            "assets/TOW-windows-x64.zip#Windows: TOW-windows-x64.zip - extract, double-click Start TOW.cmd" \
            "assets/install.ps1#Windows installer: install.ps1 - run it with the PowerShell line in the notes" \
            "assets/install.sh#Linux and macOS installer: install.sh - run it with the curl line in the notes" \
            "assets/tow-source.tar.gz#Source archive: tow-source.tar.gz - used by install.sh and updates" \
            "assets/SHA256SUMS#Checksums: SHA256SUMS - SHA-256 of the files above"
          [ "$(names)" = "$expected" ] || { echo "the draft of $TAG has: $(names)" >&2; exit 1; }
          readback
          cmp readback/SHA256SUMS assets/SHA256SUMS
          latest=true
          case $TAG in *-*) latest=false ;; esac
          gh release edit "$TAG" --draft=false --latest=$latest
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false ] || { echo "$TAG is still a draft" >&2; exit 1; }
          gh release view "$TAG" --json url,assets --jq '.url, .assets[].name'
