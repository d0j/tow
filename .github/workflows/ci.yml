name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces its run; two quick merges keep both runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request touches more than the docs. A docs-only one still reports every
  # required check (no path filter: a check it never started would stay pending): its gates run
  # in full on ubuntu-latest only (the docs' own tests) and succeed without work elsewhere, and
  # install.sh is not run. A push to main or a run by hand always runs everything (release.yml
  # looks for a ci run of the tagged tree). If this job fails, everything runs.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does the change touch more than the docs?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/|README(\.ru)?\.md$|CHANGELOG(\.ru)?\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: gate (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-26.04, macos-latest]
        include:
          # Keep the protected check name stable, but pin the older LTS runner. The dependency
          # audit reads uv.lock, the same on every OS: it runs here only, and so does the
          # compile of the base-Python files with a real Python 3.11.
          - os: ubuntu-latest
            runner: ubuntu-24.04
            audit: true
            py311: true
    runs-on: ${{ matrix.runner || matrix.os }}
    # Above the gate's own 30-minute deadline for the test run plus setup and the wheel smoke: a
    # hung run is stopped by the gate, which names and ends its processes, not by the runner.
    timeout-minutes: 45
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' || matrix.os == 'ubuntu-latest' }}
    steps:
      # Pinned to full commit SHAs (the tag in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: env.RUN == 'true'
        with:
          enable-cache: true
          # One writer per runner cache: PRs and smoke jobs only restore it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Python from .python-version
        if: env.RUN == 'true'
        run: uv python install --no-bin --no-registry
      # update.py, the web update worker and its lock module run on the install's base Python,
      # which may be any 3.11+. ast.parse(feature_version=(3, 11)) in the tests still accepts
      # 3.12 syntax such as f"{d["a"]}"; Python 3.11 itself does not. The updater's own harness
      # then runs on that Python alone (-I: its standard library, no TOW, no pytest).
      - name: Compile the base-Python files with Python 3.11 and run the updater on it
        if: env.RUN == 'true' && matrix.py311
        run: |
          uv python install 3.11 --no-bin --no-registry
          "$(uv python find --no-project 3.11)" -m py_compile scripts/update.py scripts/root_files.py src/tow/update_worker.py src/tow/platform/locks.py src/tow/platform/_local_service_worker.py tests/updater_stdlib.py
          "$(uv python find --no-project 3.11)" -I tests/updater_stdlib.py
      - name: Sync locked environment
        if: env.RUN == 'true'
        run: uv sync --frozen
      - name: Quality gate${{ matrix.audit && ' (with dependency audit)' || '' }}
        if: env.RUN == 'true'
        shell: pwsh
        run: ./scripts/gate.ps1 ${{ matrix.audit && '-Audit' || '' }}

  # The install.sh check the release runs on a tag, here on every commit: a broken check is found
  # before a tag, not by a release that cannot publish. The archive is git's own of this commit,
  # one top folder like GitHub's tag archive.
  install:
    name: install.sh (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04, macos-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 20
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source archive of this commit
        if: env.RUN == 'true'
        run: git archive --format=tar.gz --prefix=tow/ -o "$RUNNER_TEMP/tow-source.tar.gz" HEAD
      - name: Install, start with the start file, check, stop, reinstall, uninstall
        if: env.RUN == 'true'
        run: sh scripts/install-smoke.sh "$RUNNER_TEMP/tow-source.tar.gz" 18877

  # Windows, the owner's system, on every commit: the bundle built once from git's archive of this
  # commit, unpacked, started offline, stopped, moved with its environment, started offline again
  # (bundle-smoke.ps1, which also fails on a write to the tested TEMP or outside the folder).
  # install.ps1, the folder-limit runs and the update stay in installers.yml and release.yml.
  bundle:
    name: Windows bundle smoke
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: env.RUN == 'true'
        with:
          save-cache: false
      - name: Source archive of this commit
        if: env.RUN == 'true'
        shell: bash
        run: git archive --format=tar.gz --prefix=tow/ -o "$RUNNER_TEMP/tow-source.tar.gz" HEAD
      - name: Build the bundle
        if: env.RUN == 'true'
        shell: pwsh
        run: uv run --no-project python scripts/build-bundle.py --out dist --source "$env:RUNNER_TEMP/tow-source.tar.gz"
      - name: Unpack, start offline, stop, move with its existing environment, start offline again
        if: env.RUN == 'true'
        shell: pwsh
        run: ./scripts/bundle-smoke.ps1 -Zip dist/TOW-windows-x64.zip -Offline -Move
