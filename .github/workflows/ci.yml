name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-26.04, macos-latest]
        include:
          # Keep the protected check name stable, but pin the older LTS runner. The dependency
          # audit reads uv.lock, the same on every OS: it runs here only, and so does the
          # compile of the base-Python files with a real Python 3.11.
          - os: ubuntu-latest
            runner: ubuntu-24.04
            audit: true
            py311: true
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 30
    steps:
      # Pinned to full commit SHAs (the tag in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install --no-bin --no-registry
      # update.py, the web update worker and its lock module run on the install's base Python,
      # which may be any 3.11+. ast.parse(feature_version=(3, 11)) in the tests still accepts
      # 3.12 syntax such as f"{d["a"]}"; Python 3.11 itself does not.
      - name: Compile the base-Python files with Python 3.11
        if: matrix.py311
        run: |
          uv python install 3.11 --no-bin --no-registry
          "$(uv python find --no-project 3.11)" -m py_compile scripts/update.py src/tow/update_worker.py src/tow/platform/locks.py
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Quality gate${{ matrix.audit && ' (with dependency audit)' || '' }}
        shell: pwsh
        run: ./scripts/gate.ps1 ${{ matrix.audit && '-Audit' || '' }}

  # The install.sh check the release runs on a tag, here on every commit: a broken check is found
  # before a tag, not by a release that cannot publish. The archive is git's own of this commit,
  # one top folder like GitHub's tag archive.
  install:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04, macos-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source archive of this commit
        run: git archive --format=tar.gz --prefix=tow/ -o "$RUNNER_TEMP/tow-source.tar.gz" HEAD
      - name: Install, start with the start file, check, stop, reinstall, uninstall
        run: sh scripts/install-smoke.sh "$RUNNER_TEMP/tow-source.tar.gz" 18877
