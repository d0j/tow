name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Linux and macOS report but do not block yet: the suite is OS-neutral (platform backends are
    # injected in tests) but has not had a green run on those runners. Drop this line after one.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      # Pinned by major tag; Dependabot (.github/dependabot.yml) proposes updates. Pin to full
      # commit SHAs once they are verified against the actions' release pages.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Quality gate (with dependency audit)
        shell: pwsh
        run: ./scripts/gate.ps1 -Audit
