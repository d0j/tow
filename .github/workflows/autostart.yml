name: autostart

# The autostart of each OS for real - Task Scheduler, launchd, systemd --user - turned on for a
# throwaway install of the given commit made the way the owner makes one, started by the OS and
# turned off again (tests/integration/test_real_autostart.py). A reusable workflow: real.yml runs it
# on its own triggers, release.yml on the commit it checked, so a release is published only after
# all three systems started that very commit. With `strict` (the release, the weekly run) a runner
# that cannot run the test - no systemd user manager - fails it instead of skipping it; the jobs of
# the three systems are never left out.

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to install and test"
        required: true
        type: string
      strict:
        description: "Fail instead of skipping when the runner cannot run the test"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  autostart:
    name: autostart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TOW_REAL_AUTOSTART: "1"
      TOW_REAL_AUTOSTART_PORT: "18877"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          save-cache: false
      - name: Install Python from .python-version
        run: uv python install --no-bin --no-registry
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Source archive of this commit
        shell: bash
        run: git archive --format=tar.gz --prefix=tow/ -o "$RUNNER_TEMP/tow-source.tar.gz" HEAD
      # A runtime install, made as the owner makes one: autostart refuses a development checkout.
      - name: Install it with install.sh (Linux, macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          dir="$RUNNER_TEMP/tow autostart Тест"  # a Cyrillic folder, as many owners have
          printf '%s  tow-source.tar.gz\n' "$(shasum -a 256 "$RUNNER_TEMP/tow-source.tar.gz" | cut -d ' ' -f 1)" >"$RUNNER_TEMP/SHA256SUMS"
          # The installer runs as on a new computer: no uv variables of this job.
          for name in $(env | sed -n 's/^\(UV_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done
          TOW_INSTALL_SOURCE="$RUNNER_TEMP/tow-source.tar.gz" TOW_INSTALL_SUMS="$RUNNER_TEMP/SHA256SUMS" \
            sh install/install.sh --dir "$dir" --port "$TOW_REAL_AUTOSTART_PORT" </dev/null
          echo "TOW_REAL_AUTOSTART_ROOT=$dir" >>"$GITHUB_ENV"
      - name: Build the bundle and install it with install.ps1 (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          uv run --no-project python scripts/build-bundle.py --out dist --source "$env:RUNNER_TEMP/tow-source.tar.gz"
          if ($LASTEXITCODE) { throw "build-bundle.py exited with $LASTEXITCODE" }
          $zip = (Resolve-Path dist/TOW-windows-x64.zip).Path
          $sums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS'
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())  TOW-windows-x64.zip" | Set-Content -Encoding ascii $sums
          # A Cyrillic folder, as many owners have ("Test" in Russian, made from its code points).
          $dir = Join-Path $env:RUNNER_TEMP ('TOW autostart ' + (-join [char[]](0x0422, 0x0435, 0x0441, 0x0442)))
          $port = [int]$env:TOW_REAL_AUTOSTART_PORT
          # The installer runs as on a new computer: no uv or TOW variables of this job.
          Get-ChildItem env: | Where-Object { $_.Name -like 'UV_*' -or $_.Name -like 'TOW_*' } | ForEach-Object { Remove-Item "env:$($_.Name)" }
          $env:TOW_INSTALL_SOURCE = $zip; $env:TOW_INSTALL_SUMS = $sums; $env:TOW_NO_BROWSER = '1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install/install.ps1 -Dir $dir -Port $port
          if ($LASTEXITCODE) { throw "install.ps1 exited with $LASTEXITCODE" }
          "TOW_REAL_AUTOSTART_ROOT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The user's systemd manager without a sign-in (Linux)
        if: runner.os == 'Linux'
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          user=$(id -un)
          uid=$(id -u)
          sudo loginctl enable-linger "$user"
          for attempt in $(seq 1 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >>"$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >>"$GITHUB_ENV"
          if XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
            systemctl --user show-environment >/dev/null; then
            echo "the user manager of $user answers"
          else
            reason="systemctl --user does not answer on this runner (no user manager after loginctl enable-linger)"
            if [ "$STRICT" = true ]; then
              echo "::error::$reason: a release or weekly run does not pass on a skip"
              exit 1
            fi
            echo "::warning::$reason"
            echo "TOW_REAL_AUTOSTART_SKIP=$reason" >>"$GITHUB_ENV"
          fi
      - name: tow autostart on, the OS starts TOW, tow autostart off
        timeout-minutes: 20
        shell: bash
        run: uv run --frozen pytest -q -ra -p no:cacheprovider tests/integration/test_real_autostart.py
      - name: The install's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autostart-logs-${{ matrix.os }}
          path: ${{ env.TOW_REAL_AUTOSTART_ROOT }}/data/logs
          if-no-files-found: warn
      - name: Leave nothing registered or running
        if: always() && env.TOW_REAL_AUTOSTART_ROOT != '' && runner.os != 'Windows'
        run: |
          "$TOW_REAL_AUTOSTART_ROOT/app/scripts/tow" autostart off || true
          "$TOW_REAL_AUTOSTART_ROOT/app/scripts/tow" stop || true
      - name: Leave nothing registered or running (Windows)
        if: always() && env.TOW_REAL_AUTOSTART_ROOT != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $launcher = Join-Path $env:TOW_REAL_AUTOSTART_ROOT 'app\scripts\tow.cmd'
          & $launcher autostart off
          & $launcher stop
          exit 0
