  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- set chosen = theme() %}
  <meta name="color-scheme" content="{{ chosen or 'dark light' }}">
  {% if chosen != 'dark' %}<meta name="theme-color"{% if not chosen %} media="(prefers-color-scheme: light)"{% endif %} content="#f4f6fa">{% endif %}
  {% if chosen != 'light' %}<meta name="theme-color" content="#0b0d12">{% endif %}
  <title>{% if title %}TOW — {{ title }}{% else %}TOW{% endif %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{ static_version }}">
  <link rel="stylesheet" href="/static/updates.css?v={{ static_version }}">
  <link rel="stylesheet" href="/static/content.css?v={{ static_version }}">
